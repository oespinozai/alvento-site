  <radialGradient id="glow"><stop stop-color="#c4f042" stop-opacity=".12"/><stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x2="0" y2="1"><stop stop-color="#d4ff4a"/><stop offset="1" stop-color="#7c992c"/></linearGradient>
