# Install on gaia as /etc/systemd/system/ollama.service.d/gpu-wait.conf, then `systemctl daemon-reload`.
# Boot-race guard: start ollama only after the Tailscale IP and the GPU are ready, so GPU
# discovery (done once per start) cannot find nothing and silently fall back to CPU.
# The leading "-" and the script's own exit 0 mean a failed wait never blocks or crashloops ollama.
# TimeoutStartSec exceeds the script's 120s wait; the default 90s would kill the unit mid-wait.
[Unit]
After=tailscaled.service

[Service]
ExecStartPre=-/usr/local/sbin/ollama-wait-ready.sh
TimeoutStartSec=180
